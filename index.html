<title>ENERGY$ · Telegram Mini App</title>
<style>
:root{color-scheme:dark;--bg:#111116;--panel:#24232D;--panel2:#302F3B;--line:#393744;--muted:#A9A5B8;--text:#F4F0FF;--accent:#A78BFA;--accent2:#C4B5FD;--deep:#17131F;--danger:#FF818A;--radius:22px}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#302548 0,transparent 40%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding:0 0 calc(94px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.view{display:none;animation:fade .22s ease}.view.active{display:block}@keyframes fade{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:850}.hero{background:linear-gradient(140deg,#302548,#211D2B 80%);border:1px solid #4B3D67;border-radius:26px;padding:21px;position:relative;overflow:hidden}.hero:after{content:"$";position:absolute;right:4px;top:-35px;font-size:165px;line-height:1;font-weight:950;color:#A78BFA0C;pointer-events:none}.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.pill{background:#A78BFA1C;border:1px solid #A78BFA40;border-radius:99px;padding:7px 10px;font-size:10px;color:var(--accent2);font-weight:850}.hero-total{font-size:clamp(39px,11vw,54px);font-weight:950;letter-spacing:-2px;line-height:1.1;margin:14px 0 17px;position:relative;z-index:1;overflow-wrap:anywhere}.hero-bottom{display:flex;justify-content:space-between;gap:12px;align-items:end;position:relative;z-index:1}.hero-bottom p{margin:0;font-size:11px;color:#C0B6D2}.hero-count{font-size:23px;font-weight:900;margin-top:3px}.hero-count span{font-size:11px;font-weight:700;color:#C0B6D2}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:11px 0 17px}.stat{padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:19px;min-width:0}.stat .stat-icon{font-size:17px;margin-bottom:10px}.stat .value{font-size:22px;font-weight:900;letter-spacing:-.5px;overflow-wrap:anywhere}.stat .label{font-size:11px;color:var(--muted);margin-top:5px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:21px;padding:16px}.chart-wrap{height:145px;position:relative}.chart-wrap canvas{width:100%;height:100%;display:block}.chart-caption{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:8px}.period-tabs{display:flex;gap:4px;background:#17161D;padding:4px;border-radius:12px}.period-tabs button{background:transparent;color:var(--muted);border-radius:9px;padding:7px 9px;font-size:10px;font-weight:850}.period-tabs button.active{background:var(--accent);color:var(--deep)}
.mascot-card{display:flex;align-items:center;gap:13px;background:linear-gradient(135deg,#24232D,#1D1B25);border:1px solid #4A405E;border-radius:22px;padding:14px;margin:14px 0 18px;position:relative;overflow:hidden}.mascot{width:88px;height:112px;flex:0 0 88px;position:relative;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 7px 9px #0004);transform-origin:50% 85%;will-change:transform}

.mascot-sprite{animation:idleFrames 1.8s steps(1,end) infinite}
.mascot-card:active .mascot-sprite{transform:scale(.96)}

@keyframes idleFrames{0%,100%{transform:translateY(0) rotate(-1deg) scale(1)}25%{transform:translateY(-2px) rotate(1deg) scale(1.01)}50%{transform:translateY(-4px) rotate(0deg) scale(1)}75%{transform:translateY(-1px) rotate(-2deg) scale(.99)}}
.can-body{transform-origin:50% 50%;transition:filter .12s}.can-top,.can-face,.mouth,.arm{transition:all .12s}.can-face{transform-origin:50% 50%}
.eye{animation:eyeBlink 5.2s steps(1,end) infinite;transform-origin:50% 50%}
@keyframes eyeBlink{0%,91%,95%,100%{transform:scaleY(1)}92%,94%{transform:scaleY(.08)}}
.mascot.mood-joy,.mascot.mood-laugh,.mascot.mood-dance,.mascot.mood-fail{animation:none}
@keyframes idleFrames{0%,100%{transform:translateY(0) rotate(-1deg)}25%{transform:translateY(-2px) rotate(1deg)}50%{transform:translateY(-4px) rotate(0)}75%{transform:translateY(-1px) rotate(-2deg)}}
@media(prefers-reduced-motion:reduce){.mascot-sprite{animation:none!important}}.can-body{position:absolute;left:16px;top:8px;width:50px;height:78px;border-radius:12px 12px 10px 10px;background:linear-gradient(90deg,#6D4AB5,#A78BFA 38%,#7956C8);border:2px solid #C4B5FD;box-shadow:inset -7px 0 0 #2B2144}.can-top{position:absolute;left:23px;top:3px;width:36px;height:8px;background:#C9C4D6;border-radius:5px;border:2px solid #7C718D}.can-face{position:absolute;left:24px;top:30px;display:flex;gap:11px}.eye{width:9px;height:12px;border-radius:50%;background:#17131F;border:1px solid #EEE7FF;position:relative}.eye:after{content:"";position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;left:2px;top:2px}.mouth{position:absolute;left:33px;top:51px;width:17px;height:9px;border-bottom:3px solid #17131F;border-radius:0 0 12px 12px}.can-bolt{position:absolute;left:31px;top:62px;color:#17131F;font-weight:1000;font-size:16px}.arm{position:absolute;top:45px;width:13px;height:26px;border:4px solid #A78BFA;border-top:0;border-radius:0 0 9px 9px}.arm.left{left:7px;transform:rotate(22deg)}.arm.right{right:5px;transform:rotate(-20deg)}.mascot-copy{min-width:0;flex:1}.mascot-name{font-size:10px;color:var(--accent2);font-weight:950;letter-spacing:1.3px}.mascot-line{font-size:13px;line-height:1.45;font-weight:750;margin-top:6px}.mascot-sub{font-size:10px;color:var(--muted);margin-top:6px}.bubble-dot{position:absolute;right:12px;top:10px;width:7px;height:7px;background:#A78BFA;border-radius:50%;box-shadow:0 0 13px #A78BFA;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
.history{display:flex;flex-direction:column;gap:8px}.entry{display:flex;align-items:center;gap:11px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:17px}.can-icon{width:42px;height:45px;flex:0 0 42px;border-radius:12px;background:linear-gradient(150deg,#39304E,#191820);display:grid;place-items:center;font-size:22px}.entry-main{min-width:0;flex:1}.entry-title{font-weight:850;font-size:13px;overflow-wrap:anywhere}.entry-date{color:var(--muted);font-size:10px;margin-top:5px}.entry-price{text-align:right;font-size:14px;font-weight:900;white-space:nowrap}.entry-actions{display:flex;gap:4px;margin-top:5px;justify-content:flex-end}.entry-actions button{background:transparent;color:var(--muted);font-size:10px;padding:3px 4px}.entry-actions button.delete{color:var(--danger)}.empty{padding:25px 14px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.empty .big{font-size:30px;margin-bottom:8px}
.friends-box{background:var(--panel);border:1px solid var(--line);border-radius:21px;padding:16px}.friend-form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.friend-form .wide{grid-column:1/-1}.friend-form input,.friend-form textarea{width:100%;background:#191820;border:1px solid #454154;border-radius:12px;padding:12px;color:var(--text);min-height:44px}.friend-form textarea{min-height:82px;resize:vertical;font-size:11px;line-height:1.45}.friend-list{display:flex;flex-direction:column;gap:8px;margin-top:13px}.friend-row{display:flex;align-items:center;gap:10px;background:#191820;border:1px solid var(--line);border-radius:15px;padding:11px}.friend-avatar{width:38px;height:38px;border-radius:13px;background:#A78BFA1C;color:var(--accent2);display:grid;place-items:center;font-weight:950;flex-shrink:0}.friend-info{min-width:0;flex:1}.friend-name{font-size:13px;font-weight:900;overflow-wrap:anywhere}.friend-meta{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.45}.friend-score{text-align:right;font-size:13px;font-weight:900;white-space:nowrap}.friend-score small{display:block;font-size:9px;color:var(--muted);font-weight:700;margin-top:4px}.friend-remove{background:transparent;color:var(--muted);padding:6px;font-size:17px}.social-note{font-size:11px;color:var(--muted);line-height:1.5;margin:11px 0 0}.friend-empty{padding:18px 8px;text-align:center;color:var(--muted);font-size:12px;line-height:1.5}.social-status{color:var(--accent2);font-size:11px;font-weight:800;line-height:1.5;margin-top:9px}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}.compare-card .mini{color:var(--muted);font-size:10px}.compare-card .big{font-size:19px;font-weight:900;margin-top:7px}.compare-card .sub{font-size:10px;color:var(--accent2);margin-top:5px;line-height:1.4}.report-card{background:linear-gradient(145deg,#302548,#211D2B);border:1px solid #4B3D67;border-radius:22px;padding:19px;position:relative;overflow:hidden}.report-card:after{content:"ϟ";position:absolute;right:9px;top:-20px;font-size:110px;color:#A78BFA12;font-weight:950}.report-card>*{position:relative;z-index:1}.report-title{font-size:11px;letter-spacing:1.5px;color:var(--accent2);font-weight:950}.report-amount{font-size:35px;font-weight:950;letter-spacing:-1px;margin:10px 0}.report-line{font-size:12px;color:#D4CDE2;line-height:1.5}.report-quote{margin-top:14px;padding-top:13px;border-top:1px solid #A78BFA33;font-weight:800;font-size:13px;line-height:1.45}.secondary-btn{background:#302F3B;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-weight:800;font-size:12px}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn-row>*{flex:1}.input-inline{width:100%;background:#191820;border:1px solid #454154;border-radius:12px;padding:11px;color:var(--text);min-height:43px}.field{display:block;margin-bottom:13px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;background:#191820;border:1px solid #454154;border-radius:12px;padding:13px;color:var(--text);min-height:46px}.row-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.settings-row:last-child{border-bottom:0}.settings-row button{background:#343142;color:var(--accent2);padding:9px 11px;border-radius:10px;font-size:10px;font-weight:850}
.bottom-note{text-align:center;color:#777286;font-size:10px;margin:23px 10px 0;line-height:1.5}
.nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,600px);padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:#17161DEB;backdrop-filter:blur(22px);border-top:1px solid #393744;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.nav button{background:transparent;color:#8F899F;border-radius:13px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:850}.nav button.active{color:var(--accent2);background:#A78BFA15}.nav .nav-icon{font-size:19px;line-height:1}
.modal-backdrop{position:fixed;inset:0;background:#000B;z-index:10;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal-backdrop.open{display:flex}.modal{width:min(100%,520px);background:#1B1A23;border:1px solid #454154;border-radius:25px;padding:21px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 20px 80px #0009;max-height:92dvh;overflow:auto}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-head h2{font-size:19px;margin:0}.close{background:#302F3B;color:var(--text);width:34px;height:34px;border-radius:11px;font-size:20px}.save-btn{width:100%;background:var(--accent);color:#17131F;padding:14px;border-radius:14px;font-weight:950;margin-top:5px}.cancel-btn{width:100%;background:transparent;color:var(--muted);padding:11px;margin-top:4px}.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:#E8DFFF;color:#17131F;padding:12px 17px;border-radius:13px;font-size:12px;font-weight:900;z-index:20;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;max-width:92vw}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:560px){.app{padding-top:24px}.modal-backdrop{align-items:center}.modal{padding-bottom:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

<body>
<div class="app">
<header><div class="brand"><div class="logo">ϟ</div><div><h1>ENERGY<span style="color:var(--accent)">$</span></h1><p>YOUR WALLET IS SWEATING</p></div></div><button class="icon-btn" id="settingsBtn" aria-label="Настройки">⚙</button></header>
<div id="telegramAuthStatus" class="tg-auth-status" role="status" aria-live="polite">Проверяем подключение Telegram…</div>

<section class="view active" id="view-home">
  <section class="hero">
    <div class="hero-top"><div class="eyebrow">Расходы за месяц</div><div class="pill" id="monthPill">ЭТОТ МЕСЯЦ</div></div>
    <div class="hero-total" id="monthTotal">0 ₽</div>
    <div class="hero-bottom"><div><p>Выпито банок</p><div class="hero-count" id="monthCount">0 <span>шт.</span></div></div><div style="text-align:right"><p>Средняя цена</p><div class="hero-count" id="avgPrice">0 ₽</div></div></div>
  </section>
  <div class="mascot-card" id="mascotCard" role="button" tabindex="0" aria-label="Поговорить с Банчиком"><div class="bubble-dot"></div>
    <div class="mascot mascot-sprite" id="mascotArt" aria-hidden="true"><img class="mascot-frame" id="mascotFrame" src="assets/mascot/idle/01.png" alt="" draggable="false"></div>
    <div class="mascot-copy"><div class="mascot-name">БАНЧИК · ТВОЙ КОРЕШ</div><div class="mascot-line" id="mascotLine">Ну чё, считаем твои инвестиции в баночки?</div><div class="mascot-sub" id="mascotSub">Нажми на меня, если не боишься правды.</div></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-icon">⚡</div><div class="value" id="todayCount">0</div><div class="label">Банок сегодня</div></div>
    <div class="stat"><div class="stat-icon">↗</div><div class="value" id="todayCost">0 ₽</div><div class="label">Потрачено сегодня</div></div>
    <div class="stat"><div class="stat-icon">▦</div><div class="value" id="allCount">0</div><div class="label">Всего банок</div></div>
    <div class="stat"><div class="stat-icon">◎</div><div class="value" id="allCost">0 ₽</div><div class="label">Потрачено за всё время</div></div>
  </div>
  <button class="quick-add" id="addBtn"><span class="plus">+</span> ЗАПИСАТЬ ЭНЕРГЕТИК</button>
  <div class="section-head"><h2>Последние покупки</h2><button class="small-link" id="goStats">Подробная статистика ↗</button></div>
  <div class="history" id="homeHistory"></div>
</section>

<section class="view" id="view-stats">
  <div class="section-head" style="margin-top:4px"><h2>Твои цифры, легенда</h2></div>
  <div class="section-head"><h2>Расходы</h2><div class="period-tabs" id="chartTabs"><button data-range="7" class="active">7 дней</button><button data-range="30">30 дней</button><button data-range="all">Всё</button></div></div>
  <div class="panel"><div class="chart-wrap"><canvas id="chart" aria-label="График расходов"></canvas></div><div class="chart-caption"><span id="chartLeft">Последние 7 дней</span><span id="chartTotal">0 ₽</span></div></div>
  <div class="section-head"><h2>Сравнения</h2></div>
  <div class="compare-grid">
    <div class="compare-card"><div class="mini">СРЕДНИЙ ЧЕК</div><div class="big" id="avgAll">0 ₽</div><div class="sub">Цена одной банки за всё время</div></div>
    <div class="compare-card"><div class="mini">ПРОШЛЫЙ МЕСЯЦ</div><div class="big" id="prevMonthCost">0 ₽</div><div class="sub" id="monthCompare">Пока нечего сравнивать</div></div>
    <div class="compare-card"><div class="mini">САМЫЙ ДОРОГОЙ МЕСЯЦ</div><div class="big" id="bestMonth">—</div><div class="sub">Где кошелёк плакал громче</div></div>
    <div class="compare-card"><div class="mini">УСЛОВНЫЙ БЕНЗИН</div><div class="big" id="fuelCompare">0 л</div><div class="sub">По цене, которую задашь ниже</div></div>
    <div class="compare-card"><div class="mini">ЭТО КАК КОФЕ</div><div class="big" id="coffeeCompare">0 чашек</div><div class="sub">Сколько чашек по заданной цене</div></div>
  </div>
  <div class="section-head"><h2>Настрой сравнение</h2></div>
  <div class="panel">
    <div class="field"><label for="fuelPrice">Цена литра бензина для сравнения, ₽</label><input id="fuelPrice" type="number" min="1" max="10000" step="1" class="input-inline" value="60"></div>
    <div class="field"><label for="coffeePrice">Цена кофе для сравнения, ₽</label><input id="coffeePrice" type="number" min="1" max="10000" step="1" class="input-inline" value="200"></div>
  </div>
  <div class="section-head"><h2>Мемный отчёт</h2><button class="small-link" id="refreshRoast">Другая реплика ↻</button></div>
  <div class="report-card" id="reportCard">
    <div class="report-title">ENERGY$ · ФИНАНСОВЫЙ АУДИТ</div>
    <div class="report-amount" id="reportAmount">0 ₽</div>
    <div class="report-line" id="reportLine">Добавь покупки, чтобы мы посчитали масштаб происходящего.</div>

function openModal(id){$(id).classList.add('open');document.body.style.overflow='hidden'}
function closeModal(id){$(id).classList.remove('open');if(!$('entryBackdrop').classList.contains('open')&&!$('settingsBackdrop').classList.contains('open'))document.body.style.overflow=''}
function openNew(){$('entryForm').reset();$('entryId').value='';$('entryModalTitle').textContent='Новый энергетик';$('saveEntryBtn').textContent='Сохранить запись';$('drinkDate').value=localDateTimeValue(new Date());openModal('entryBackdrop');setTimeout(()=>$('drinkPrice').focus({preventScroll:true}),100)}
function openEdit(id){const e=entries.find(x=>x.id===id);if(!e)return;$('entryId').value=e.id;$('drinkName').value=e.name||'';$('drinkPrice').value=e.price;$('drinkDate').value=localDateTimeValue(safeDate(e.date));$('entryModalTitle').textContent='Изменить запись';$('saveEntryBtn').textContent='Сохранить изменения';openModal('entryBackdrop')}
function deleteEntry(id){const e=entries.find(x=>x.id===id);if(!e)return;if(!confirm(`Удалить запись «${e.name||'Энергетик'}» за ${rub(e.price)}?`))return;entries=entries.filter(x=>x.id!==id);save();render();toast('Запись удалена')}
$('addBtn').addEventListener('click',openNew);
$('entryForm').addEventListener('submit',ev=>{ev.preventDefault();const price=Number($('drinkPrice').value),date=$('drinkDate').value;if(!Number.isFinite(price)||price<0||!date){toast('Проверь цену и дату');return}const id=$('entryId').value;const entry={id:id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())+Math.random()),name:$('drinkName').value.trim(),price:Math.round(price*100)/100,date:new Date(date).toISOString()};if(id){entries=entries.map(e=>e.id===id?entry:e);toast('Изменения сохранены')}else{entries.push(entry);toast('Запись добавлена. Банчик всё видел ⚡')}save();closeModal('entryBackdrop');render()});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));document.querySelectorAll('.modal-backdrop').forEach(b=>b.addEventListener('click',e=>{if(e.target===b)closeModal(b.id)}));
$('settingsBtn').addEventListener('click',()=>openModal('settingsBackdrop'));
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));$('goStats').addEventListener('click',()=>switchView('stats'));
$('chartTabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{chartRange=b.dataset.range;$('chartTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderChart()}));
$('allHistoryBtn').addEventListener('click',()=>{showAllHistory=!showAllHistory;$('allHistory').style.display=showAllHistory?'flex':'none';$('allHistoryBtn').textContent=showAllHistory?'Свернуть ↑':'Показать всю историю ↓'});
$('fuelPrice').addEventListener('change',()=>{settings.fuelPrice=Math.max(1,Number($('fuelPrice').value)||60);saveSettings();render()});$('coffeePrice').addEventListener('change',()=>{settings.coffeePrice=Math.max(1,Number($('coffeePrice').value)||200);saveSettings();render()});
$('mascotCard').addEventListener('click',nextRoast);$('mascotCard').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nextRoast()}});$('tapMascot').addEventListener('click',nextRoast);$('refreshRoast').addEventListener('click',()=>{nextRoast();toast('Новая порция правды')});
$('secretBtn').addEventListener('click',()=>{const el=$('secretText');el.style.display=el.style.display==='none'?'block':'none';if(el.style.display==='block')toast('Секретный режим активирован')});
$('roastToggle').addEventListener('click',()=>{settings.roast=!settings.roast;saveSettings();render();toast(settings.roast?'Банчик снова без фильтров':'Банчику выдали отпуск')});
function reportText(){return `ENERGY$ · ФИНАНСОВЫЙ АУДИТ\nРасходы за месяц: ${rub(total(monthEntries()))}\nБанок за месяц: ${monthEntries().length}\nВсего покупок: ${entries.length}\nЗа всё время: ${rub(total(entries))}\n\n${currentRoast()}\n\nСчитаю расходы вместе с ENERGY$.`}
async function shareReport(){const text=reportText();try{if(navigator.share){await navigator.share({title:'Мой отчёт ENERGY$',text});}else{await navigator.clipboard.writeText(text);toast('Отчёт скопирован — вставляй в Telegram')}}catch(e){if(e.name!=='AbortError'){try{await navigator.clipboard.writeText(text);toast('Отчёт скопирован')}catch(_){toast('Не удалось поделиться — попробуй сохранить PNG')}}}}
$('shareReport').addEventListener('click',shareReport);
function makeReportCanvas(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');const grad=x.createLinearGradient(0,0,1080,1350);grad.addColorStop(0,'#111116');grad.addColorStop(.65,'#24202F');grad.addColorStop(1,'#302548');x.fillStyle=grad;x.fillRect(0,0,c.width,c.height);x.fillStyle='#A78BFA';x.beginPath();x.roundRect(68,70,90,90,24);x.fill();x.fillStyle='#17131F';x.font='bold 60px Arial';x.fillText('ϟ',90,137);x.fillStyle='#E8DFFF';x.font='bold 52px Arial';x.fillText('ENERGY$',185,128);x.fillStyle='#A9A5B8';x.font='bold 23px Arial';x.fillText('ФИНАНСОВЫЙ АУДИТ',72,230);x.fillStyle='#E8DFFF';x.font='bold 92px Arial';x.fillText(rub(total(monthEntries())),70,370);x.fillStyle='#A78BFA';x.font='bold 28px Arial';x.fillText('ПОТРАЧЕНО ЗА МЕСЯЦ',74,425);x.fillStyle='#E8DFFF';x.font='bold 38px Arial';x.fillText(`${monthEntries().length} банок за месяц`,74,540);x.fillText(`${entries.length} покупок за всё время`,74,605);x.fillStyle='#A9A5B8';x.font='30px Arial';const lines=[`За всё время: ${rub(total(entries))}`,currentRoast()];x.fillText(lines[0],74,690);wrapText(x,lines[1],74,790,920,48);x.strokeStyle='#A78BFA66';x.lineWidth=2;x.beginPath();x.moveTo(74,1160);x.lineTo(1006,1160);x.stroke();x.fillStyle='#A9A5B8';x.font='24px Arial';x.fillText('Твоя энергия. Твои расходы. Твои приколы.',74,1210);return c}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){let line='',yy=y;for(const word of text.split(' ')){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,yy);line=word;yy+=lineHeight}else line=test}if(line)ctx.fillText(line,x,yy)}
$('downloadCard').addEventListener('click',()=>{try{const c=makeReportCanvas(),a=document.createElement('a');a.download='energy-dollar-report.png';a.href=c.toDataURL('image/png');a.click();toast('Карточка PNG готова')}catch(e){toast('Не удалось создать карточку')}});
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('exportBtn').addEventListener('click',()=>{const rows=[['id','name','price_rub','datetime'],...entries.map(e=>[e.id,e.name||'',e.price,safeDate(e.date).toISOString()])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');download('energy-dollar-history.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('CSV готов')});
$('backupBtn').addEventListener('click',()=>{download('energy-dollar-backup.json',JSON.stringify({app:'ENERGY$',version:2,exportedAt:new Date().toISOString(),entries,settings},null,2),'application/json');toast('Резервная копия готова')});
$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text()),list=Array.isArray(obj)?obj:obj.entries;if(!Array.isArray(list)||!list.every(e=>e&&e.id&&e.date&&Number.isFinite(Number(e.price))&&Number(e.price)>=0&&Number.isFinite(new Date(e.date).getTime())))throw new Error('bad');if(!confirm(`Импортировать ${list.length} записей? Текущая история будет заменена.`))return;entries=list.map(e=>({id:String(e.id),name:String(e.name||''),price:Number(e.price),date:new Date(e.date).toISOString()}));if(obj.settings){settings={...settings,...obj.settings};saveSettings()}save();render();closeModal('settingsBackdrop');toast('Данные восстановлены')}catch(e){toast('Не удалось прочитать этот файл')}finally{ev.target.value=''}});
$('clearBtn').addEventListener('click',()=>{if(!entries.length){toast('История уже пустая');return}if(!confirm('Точно удалить ВСЮ историю? Сначала сделай резервную копию, если она нужна.'))return;entries=[];save();render();closeModal('settingsBackdrop');toast('История очищена')});
window.addEventListener('resize',()=>{if($('view-stats').classList.contains('active'))renderChart()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('entryBackdrop');closeModal('settingsBackdrop')}});
try{initTelegramMiniApp();playMascotMood('idle');load();render();$('allHistory').style.display='flex'}catch(err){console.error('ENERGY$ startup error',err);const note=document.createElement('div');note.className='panel';note.style.margin='12px 0';note.textContent='Не удалось запустить часть приложения. Обнови страницу; личные данные не удалены.';document.querySelector('.app')?.prepend(note)}
window.addEventListener('load',()=>{if(!verifiedTelegramUser)initTelegramMiniApp()},{once:true});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
